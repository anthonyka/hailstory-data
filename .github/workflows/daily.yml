name: Daily hail update
on:
  schedule:
    - cron: '35 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pillow scipy
      - run: python pipeline/daily_update.py
      - name: Commit new days
        run: |
          git config user.name "hailstory-bot"
          git config user.email "hailstory-bot@users.noreply.github.com"
          git add delta state.json
          git diff --cached --quiet || git commit -m "Add new storm days"
          git push
